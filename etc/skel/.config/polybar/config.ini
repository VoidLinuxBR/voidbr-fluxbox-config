; ============================================================
; Polybar - Tokyo Night (substitui a toolbar do Fluxbox)
; ============================================================
[colors]
bg = #d81a1b26
bg-alt = #24283b
fg = #c0caf5
fg-alt = #565f89
blue = #7aa2f7
cyan = #7dcfff
purple = #bb9af7
green = #9ece6a
orange = #ff9e64
yellow = #e0af68
red = #f7768e
border = #414868

[settings]
enable-struts = true

[bar/main]
width = 98%
height = 30
offset-x = 1%
offset-y = 8
radius = 14
fixed-center = true
background = ${colors.bg}
foreground = ${colors.fg}
border-size = 2
border-color = ${colors.border}
padding-left = 1
padding-right = 1
module-margin = 1
font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "JetBrainsMono Nerd Font:size=14;3"
modules-left = about fluxbox-workspaces xwindow
modules-center = date
modules-right = menu help pulseaudio memory cpu temperature filesystem battery xkeyboard backlight xbps-updates load network tray nwg-bar
cursor-click = pointer
enable-ipc = true
wm-restack = generic

[module/about]
type = custom/text
content = "%{T2}%{T-} VoidBR"
content-foreground = ${colors.green}
click-left = bash -c "fastfetch --logo none | yad --text-info --title='Sobre o VoidBR' --width=460 --height=460 --fontname='monospace 10' --button=Fechar:0" &

[module/menu]
type = custom/text
content = "%{T2}%{T-} Apps"
content-foreground = ${colors.purple}
click-left = rofi -show drun &

[module/fluxbox-workspaces]
type = internal/xworkspaces
label-active = %index%
label-active-background = ${colors.blue}
label-active-foreground = ${colors.bg}
label-active-padding = 2
label-occupied = %index%
label-occupied-padding = 2
label-urgent = %index%
label-urgent-background = ${colors.red}
label-urgent-padding = 2
label-empty = %index%
label-empty-foreground = ${colors.fg-alt}
label-empty-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%
label-foreground = ${colors.purple}

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %A, %d de %B
label = %date%
label-foreground = ${colors.cyan}

[module/help]
type = custom/text
content = "%{T2}%{T-} Ajuda"
content-foreground = ${colors.cyan}
click-left = voidbr-fluxbox-shortcuts &

[module/pulseaudio]
type = custom/script
exec = ~/.config/polybar/scripts/volume.sh
interval = 1
click-left = pactl set-sink-mute @DEFAULT_SINK@ toggle
click-right = pavucontrol &
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%
label-foreground = ${colors.fg}


[module/memory]
type = internal/memory
interval = 2
format-prefix = %{T2}%{T-} 
format-prefix-foreground = ${colors.green}
label = %percentage_used%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = %{T2}%{T-} 
format-prefix-foreground = ${colors.orange}
label = %percentage%%


[module/temperature]
type = custom/script
exec = ~/.config/polybar/scripts/temperature.sh
interval = 5
label-foreground = ${colors.orange}

[module/backlight]
type = custom/script
exec = ~/.config/polybar/scripts/backlight.sh
interval = 5
label-foreground = ${colors.yellow}

[module/battery]
type = custom/script
exec = ~/.config/polybar/scripts/battery.sh
interval = 10
label-foreground = ${colors.yellow}

[module/network]
type = custom/script
exec = ~/.config/polybar/scripts/network.sh
interval = 3
label-foreground = ${colors.blue}
click-left = nm-connection-editor &

[module/nwg-bar]
type = custom/text
content = "%{T2}⏻%{T-} Power"
content-foreground = ${colors.red}
click-left = nwg-bar &



[module/filesystem]
type = internal/fs
mount-0 = /
interval = 25
format-mounted = <label-mounted>
format-mounted-prefix = "%{T2}%{T-} "
format-mounted-prefix-foreground = ${colors.purple}
label-mounted = %percentage_used%%
format-unmounted-prefix = ""
label-unmounted = %mountpoint% não montado


[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = scroll lock
format = <label-layout>
format-prefix = "%{T2}%{T-} "
format-prefix-foreground = ${colors.cyan}
label-layout = %layout%
label-layout-foreground = ${colors.fg}


[module/xbps-updates]
type = custom/script
exec = ~/.config/polybar/scripts/xbps-updates.sh
interval = 3600
format-prefix = "%{T2}%{T-} "
format-prefix-foreground = ${colors.green}
click-left = xfce4-terminal -e "sudo xbps-install -Su" &

[module/load]
type = custom/script
exec = awk '{printf "Carga %.2f", $1}' /proc/loadavg
interval = 5
format-prefix = "%{T2}%{T-} "
format-prefix-foreground = ${colors.blue}
click-left = gnome-system-monitor &

[module/tray]
type = internal/tray
tray-spacing = 8
