; ============================================================
; Polybar - Tokyo Night (substitui a toolbar do Fluxbox)
; ============================================================
[colors]
bg = #d81a1b26
bg-alt = #24283b
fg = #c0caf5
fg-alt = #565f89
blue = #7aa2f7
cyan = #7dcfff
purple = #bb9af7
green = #9ece6a
orange = #ff9e64
yellow = #e0af68
red = #f7768e
border = #414868

[bar/main]
width = 98%
height = 30
offset-x = 1%
offset-y = 8
radius = 14
fixed-center = true
background = ${colors.bg}
foreground = ${colors.fg}
border-size = 2
border-color = ${colors.border}
padding-left = 1
padding-right = 1
module-margin = 1
font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "JetBrainsMono Nerd Font:size=14;3"
modules-left = fluxbox-workspaces xwindow
modules-center = date
modules-right = pulseaudio memory cpu network tray nwg-bar
cursor-click = pointer
enable-ipc = true
wm-restack = generic

[module/fluxbox-workspaces]
type = internal/xworkspaces
label-active = %index%
label-active-background = ${colors.blue}
label-active-foreground = ${colors.bg}
label-active-padding = 2
label-occupied = %index%
label-occupied-padding = 2
label-urgent = %index%
label-urgent-background = ${colors.red}
label-urgent-padding = 2
label-empty = %index%
label-empty-foreground = ${colors.fg-alt}
label-empty-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%
label-foreground = ${colors.purple}

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %A, %d de %B
label = %date%
label-foreground = ${colors.cyan}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
format-volume-foreground = ${colors.fg}
label-volume = %percentage%%
label-volume-foreground = ${colors.fg}
label-muted = %{T2}%{T-}  mudo
label-muted-foreground = ${colors.fg-alt}
ramp-volume-0 = %{T2}%{T-}
ramp-volume-1 = %{T2}%{T-}
ramp-volume-2 = %{T2}%{T-}

[module/memory]
type = internal/memory
interval = 2
format-prefix = %{T2}%{T-} 
format-prefix-foreground = ${colors.green}
label = %percentage_used%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = %{T2}%{T-} 
format-prefix-foreground = ${colors.orange}
label = %percentage%%

[module/network]
type = internal/network
interface-type = wired
interval = 3
format-connected-prefix = %{T2}%{T-} 
format-connected-prefix-foreground = ${colors.blue}
label-connected = %downspeed:9%
format-disconnected-prefix = %{T2}%{T-} 
format-disconnected-prefix-foreground = ${colors.red}
label-disconnected = offline

[module/nwg-bar]
type = custom/text
content = "%{T2}⏻%{T-}"
content-foreground = ${colors.red}
click-left = nwg-bar &

[module/tray]
type = internal/tray
tray-spacing = 8
