! ============================================================
!  Tokyo Night - Tema para Fluxbox
!  (corrigido: chaves "soltas" definem TEXTURA, nao cor.
!   cor de verdade vai sempre em .color / .colorTo)
! ============================================================

window.font: sans-8
window.justify: Left

window.title.focus: flat gradient diagonal
window.title.focus.color: #1a1b26
window.title.focus.colorTo: #24283b

window.title.unfocus: flat gradient diagonal
window.title.unfocus.color: #16161e
window.title.unfocus.colorTo: #1a1b26

window.label.focus: flat gradient diagonal
window.label.focus.color: #1a1b26
window.label.focus.colorTo: #24283b
window.label.focus.textColor: #c0caf5

window.label.unfocus: flat gradient diagonal
window.label.unfocus.color: #16161e
window.label.unfocus.colorTo: #1a1b26
window.label.unfocus.textColor: #565f89

window.button.focus: flat gradient diagonal
window.button.focus.color: #24283b
window.button.focus.colorTo: #1a1b26
window.button.focus.picColor: #7aa2f7

window.button.unfocus: flat gradient diagonal
window.button.unfocus.color: #16161e
window.button.unfocus.colorTo: #1a1b26
window.button.unfocus.picColor: #414868

window.button.pressed: flat solid
window.button.pressed.color: #7aa2f7
window.button.pressed.colorTo: #bb9af7

window.grip.focus: flat gradient diagonal
window.grip.focus.color: #1a1b26
window.grip.focus.colorTo: #24283b
window.grip.unfocus: flat gradient diagonal
window.grip.unfocus.color: #16161e
window.grip.unfocus.colorTo: #1a1b26

window.handle.focus: flat gradient diagonal
window.handle.focus.color: #1a1b26
window.handle.focus.colorTo: #24283b
window.handle.unfocus: flat gradient diagonal
window.handle.unfocus.color: #16161e
window.handle.unfocus.colorTo: #1a1b26

window.frame.focusColor: #7aa2f7
window.frame.unfocusColor: #414868

window.borderWidth: 2
window.borderColor: #7aa2f7
window.handleWidth: 4
window.roundCorners: TopLeft TopRight
window.title.height: 24

! ------------------------------------------------------------
! MENU (aqui estava o bug do menu branco)
! ------------------------------------------------------------
menu.itemHeight: 22
menu.titleHeight: 24
menu.bevelWidth: 2
menu.borderWidth: 1
menu.borderColor: #414868

menu.title: flat solid
menu.title.color: #1a1b26
menu.title.textColor: #7dcfff
menu.title.justify: Center

menu.frame: flat solid
menu.frame.color: #1a1b26
menu.frame.textColor: #c0caf5
menu.frame.disableColor: #565f89
menu.frame.justify: Left

menu.hilite: flat solid
menu.hilite.color: #283457
menu.hilite.textColor: #7aa2f7

menu.roundCorners: TopLeft TopRight BottomLeft BottomRight
menu.bullet: triangle
menu.bullet.position: Right

! ------------------------------------------------------------
! TOOLBAR (fica desativada no init, mas estilizada por segurança)
! ------------------------------------------------------------
toolbar: flat solid
toolbar.color: #1a1b26
toolbar.height: 26
toolbar.borderWidth: 1
toolbar.borderColor: #414868

toolbar.clock: flat solid
toolbar.clock.color: #1a1b26
toolbar.clock.textColor: #bb9af7
toolbar.clock.font: sans-8
toolbar.clock.justify: Center

toolbar.workspace: flat solid
toolbar.workspace.color: #1a1b26
toolbar.workspace.textColor: #c0caf5
toolbar.workspace.font: sans-8

toolbar.button.focus.color: #24283b
toolbar.button.focus.picColor: #7dcfff
toolbar.button.unfocus.color: #1a1b26
toolbar.button.unfocus.picColor: #565f89

toolbar.iconbar.focus.color: #24283b
toolbar.iconbar.focus.textColor: #c0caf5
toolbar.iconbar.focus.borderColor: #7aa2f7

toolbar.iconbar.unfocus.color: #1a1b26
toolbar.iconbar.unfocus.textColor: #565f89
toolbar.iconbar.unfocus.borderColor: #414868

toolbar.iconbar.empty.color: #1a1b26

! ------------------------------------------------------------
! SLIT
! ------------------------------------------------------------
slit: flat solid
slit.color: #1a1b26
slit.borderColor: #414868
slit.borderWidth: 1

! ------------------------------------------------------------
! GERAL
! ------------------------------------------------------------
borderWidth: 1
borderColor: #414868
bevelWidth: 2
handleWidth: 4

*.foregroundColor: #c0caf5
*.backgroundColor: #1a1b26
*.selectColor: #7aa2f7
