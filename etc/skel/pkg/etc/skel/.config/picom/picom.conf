# ============================================================
# picom.conf - Compositor para dar o visual Sway/Hyprland ao Fluxbox
# Blur, sombras, transparência e cantos arredondados
# ============================================================

backend = "glx";
vsync = true;

# --- Cantos arredondados ---
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];
round-borders = 1;

# --- Sombras (cor combinando com o tema, azul-arroxeado escuro) ---
shadow = true;
shadow-radius = 18;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.55;
shadow-color = "#16161e";
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Rofi'"
];

# --- Blur (efeito "vidro fosco" tipo Hyprland) ---
blur-method = "dual_kawase";
blur-strength = 7;
blur-background = true;
blur-background-fixed = true;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# --- Transparência / opacidade ---
active-opacity = 1.0;
inactive-opacity = 0.90;
frame-opacity = 0.95;
inactive-opacity-override = false;
opacity-rule = [
  "90:class_g = 'kitty' && focused",
  "80:class_g = 'kitty' && !focused",
  "95:class_g = 'Rofi'",
  "95:class_g = 'Dunst'"
];

# --- Fading suave ao abrir/fechar janelas ---
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 6;

wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 0.9; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.95; };
  dropdown_menu = { opacity = 0.95; };
};
